name: Windows Runner Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, Windows, x64]

    steps:
      - uses: actions/checkout@v4

      - name: Verify Cargo
        shell: powershell
        run: |
          git --version
          python --version
          cargo --version
          rustc --version
          cmake --version
          clang --version
          ninja --version

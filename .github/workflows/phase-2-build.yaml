name: Phase 2 - Configure Build Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_on_win11:
    runs-on: [self-hosted, Windows, x64]

    steps:
      - uses: actions/checkout@v4

      - name: Verify Tools on Win11
        shell: powershell
        run: |
          git --version
          python --version
          cargo --version
          rustc --version
          cmake --version
          clang --version
          ninja --version

      - name: Configure
        shell: powershell
        run: cmake -S . -B build -G Ninja

      - name: Build
        shell: powershell
        run: cmake --build build

      - name: Test
        shell: powershell
        run: ctest --test-dir build --output-on-failure

  build_on_linux:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - uses: actions/checkout@v4

      - name: Verify Tools on Linux
        shell: bash
        run: |
          git --version
          python3 --version
          cargo --version
          rustc --version
          cmake --version
          clang --version
          ninja --version

      - name: Configure
        shell: bash
        run: cmake -S . -B build -G Ninja

      - name: Build
        shell: bash
        run: cmake --build build

      - name: Test
        shell: bash
        run: ctest --test-dir build --output-on-failure


name: Phase 2 - Configure Build Test

on:
  push:
  workflow_dispatch:

jobs:
  build_on_win11:
    runs-on: [self-hosted, Windows, x64]

    steps:
      - uses: actions/checkout@v4

      - name: Verify Tools on Win11
        shell: powershell
        run: |
          git --version
          python --version
          cargo --version
          rustc --version
          cmake --version
          clang --version
          ninja --version

      - name: Run Python tests
        run: pytest

      - name: Run Rust tests
        run: cargo test

  build_on_linux:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - uses: actions/checkout@v4

      - name: Verify Tools on Linux
        shell: bash
        run: |
          git --version
          python3 --version
          cargo --version
          rustc --version
          cmake --version
          clang --version
          ninja --version

      - name: Run Python tests
        run: |
          cd python_app
          pytest

      - name: Run Rust tests
        run: |
          cd rust_collector
          cargo test


name: Phase 2 - Configure Build Test

on:
  push:
  workflow_dispatch:

jobs:
  build_on_win11:
    runs-on: [self-hosted, Windows, x64]

    steps:
      - uses: actions/checkout@v4

      - name: Verify Tools on Win11
        shell: powershell
        run: |
          git --version
          python --version
          cargo --version
          rustc --version
          cmake --version
          clang --version
          ninja --version

      - name: Install Python test dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run Python tests
        shell: powershell
        run: |
          python -m pytest python_app/tests -v
  
  build_on_linux:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - uses: actions/checkout@v4

      - name: Verify Tools on Linux
        shell: bash
        run: |
          git --version
          python3 --version
          cargo --version
          rustc --version
          cmake --version
          clang --version
          ninja --version

      - name: Install Python test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest

      - name: Run Python tests
        run: |
          python3 -m pytest python_app/tests -v

name: Phase 2 - Configure Build Test

on:
  push:
  workflow_dispatch:

jobs:
  build_on_win11:
    runs-on: [self-hosted, Windows, x64]

    steps:
      - uses: actions/checkout@v4

      - name: Verify Tools on Win11
        shell: powershell
        run: |
          git --version
          python --version
          pip --version
          cargo --version
          rustc --version
          cmake --version
          clang --version
          ninja --version

      - name: Install Python test dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run Python tests
        shell: powershell
        run: |
          python -m pytest python_app/tests -v

      - name: Run Rust tests
        shell: powershell
        working-directory: rust_collector
        run: cargo test --verbose

  
  build_on_linux:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - uses: actions/checkout@v4

      - name: Verify Tools on Linux
        shell: bash
        run: |
          git --version
          python3 --version
          pip --version
          cargo --version
          rustc --version
          cmake --version
          clang --version
          ninja --version
          gcc --version
          qemu-system-x86_64 --version
          qemu-system-arm --version
          qemu-system-aarch64 --version
          qemu-img --version


      - name: Set up Python venv
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install pytest

      - name: Run Python tests
        run: |
          .venv/bin/python -m pytest python_app/tests -v

      - name: Run Rust tests
        working-directory: rust_collector
        run: cargo test --verbose         
          



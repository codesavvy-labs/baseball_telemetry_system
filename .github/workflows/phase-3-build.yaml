name: Phase 3 - Configure Build Linting

on:
  push:
  workflow_dispatch:

jobs:
  build_on_win11:
    runs-on: [self-hosted, Windows, x64]

    steps:
      - uses: actions/checkout@v4

      - name: Verify Tools on Win11
        shell: powershell
        run: |
          git --version
          python --version
          pip --version
          cargo --version
          rustc --version
          cmake --version
          clang --version
          clang-tidy --version
          ninja --version

      - name: Upgrade pip
        shell: powershell
        run: python -m pip install --upgrade pip

      - name: Install Python lint tools
        shell: powershell
        run: |
          python -m pip install black ruff

      - name: Python format check
        shell: powershell
        run: |
          python -m black --check python_app

      - name: Python lint
        shell: powershell
        run: |
          python -m ruff check python_app
          
      - name: Install Python test dependencies
        shell: powershell
        run: |
          python -m pip install pytest

      - name: Run Python tests
        shell: powershell
        run: |
          python -m pytest python_app/tests -v

      - name: Rust Format Check
        shell: powershell
        working-directory: rust_collector
        run: cargo fmt --check
        
      - name: Rust Clippy
        shell: powershell
        working-directory: rust_collector
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust Unit Tests
        shell: powershell
        working-directory: rust_collector
        run: cargo test --verbose

      - name: Build release
        working-directory: rust_collector
        run: cargo build --release

      - name: Upload Rust artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-binary-${{ runner.os }}
          path: |
            rust_collector/target/release/rust_collector*
  
  build_on_linux:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - uses: actions/checkout@v4

      - name: Verify Tools on Linux
        shell: bash
        run: |
          git --version
          python3 --version
          pip --version
          cargo --version
          rustc --version
          cmake --version
          clang --version
          clang-tidy --version
          ninja --version
          gcc --version
          qemu-system-x86_64 --version
          qemu-system-arm --version
          qemu-system-aarch64 --version
          qemu-img --version

      - name: Upgrade pip
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip

      - name: Install Python lint tools
        run: |
          .venv/bin/python -m pip install black ruff

      - name: Python format check
        run: |
          .venv/bin/python -m black --check python_app

      - name: Python lint
        run: |
          .venv/bin/python -m ruff check python_app

      - name: Install pytest
        run: .venv/bin/python -m pip install pytest

      - name: Run Python tests
        run: |
          .venv/bin/python -m pytest python_app/tests -v

      - name: Rust Format Check
        working-directory: rust_collector
        run: cargo fmt --check
        
      - name: Rust Clippy
        working-directory: rust_collector
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        working-directory: rust_collector
        run: cargo test --verbose   

      - name: Build release
        working-directory: rust_collector
        run: cargo build --release
        
      - name: Upload Rust artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-binary-${{ runner.os }}
          path: |
            rust_collector/target/release/rust_collector*
 






name: Phase 3 - Configure Build Linting

on:
  push:
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:
  build_on_win11:
    runs-on: [self-hosted, Windows, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify PowerShell
        shell: pwsh
        run: |
          Write-Host "PowerShell Version:"
          $PSVersionTable
          pwsh --version

      - name: Verify Tools on Win11
        shell: pwsh
        run: |
          git --version
          python --version
          pip --version
          cargo --version
          rustc --version
          cmake --version
          clang --version
          clang-tidy --version
          ninja --version

      - name: Python - Lint & Test
        run: |
          python -m pip install black ruff pytest
          python -m black --check python_app
          python -m ruff check python_app
          python -m pytest python_app/tests

      - name: Rust - Format, Lint, Test
        working-directory: rust_collector
        run: |
          cargo fmt -- --check
          cargo clippy -- -D warnings
          cargo test
          cargo build --release

      - name: C++ - Build with MSVC
        run: |
          cmd /c '"C:\Program Files\Microsoft Visual Studio\18\Community\Common7\Tools\VsDevCmd.bat" -arch=x64 && cmake -S cpp_app -B build/cpp -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON && cmake --build build/cpp --verbose && ctest --test-dir build/cpp --output-on-failure'
          cmake -S cpp_app -B build/cpp -G Ninja
          cmake --build build/cpp

      - name: C++ - clang-tidy
        run: |
          clang-tidy cpp_app/src/main.cpp -- -Icpp_app/include
            
      - name: Upload Rust & CPP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-binary-${{ runner.os }}
          path: |
            rust_collector/target/release/rust_collector*
            cpp_app/build/baseball_telemetry_cpp.exe

  build_on_linux:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify PowerShell
        shell: pwsh
        run: |
          Write-Host "PowerShell Version:"
          $PSVersionTable
          pwsh --version

      - name: Verify Tools on Linux
        shell: bash
        run: |
          git --version
          python3 --version
          pip --version
          cargo --version
          rustc --version
          cmake --version
          clang --version
          clang-tidy --version
          ninja --version
          gcc --version
          
      - name: QEMU - Verify
        shell: pwsh
        run: |
          qemu-system-x86_64 --version
          qemu-system-arm --version
          qemu-system-aarch64 --version
          qemu-img --version

      - name: QEMU - List Machines
        shell: pwsh
        run: |
          qemu-system-aarch64 -machine help         

      - name: QEMU - Dry Run
        shell: pwsh
        run: |
          timeout 5s qemu-system-aarch64 -machine virt -cpu cortex-a53 -nographic -serial mon:stdio -display none -S

      - name: Cache Python pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust_collector/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust_collector/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Python - Lint & Test
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install black ruff
          .venv/bin/python -m black --check python_app
          .venv/bin/python -m ruff check python_app
          .venv/bin/python -m pip install pytest
          .venv/bin/python -m pytest python_app/tests -v

      - name: Rust - Format, Lint, Test
        working-directory: rust_collector     
        run: |
          cargo fmt -- --check
          cargo clippy -- -D warnings
          cargo test
          cargo build --release

      - name: Build C++
        shell: pwsh
        run: |
          cmake -S cpp_app -B build/cpp -G Ninja
          cmake --build build/cpp

      - name: C++ - clang-tidy
        run: |
          clang-tidy cpp_app/src/main.cpp -- -Icpp_app/include
      
      - name: Upload Rust & artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-binary-${{ runner.os }}
          path: |
            rust_collector/target/release/rust_collector*
            cpp_app/build/baseball_telemetry_cpp       
 






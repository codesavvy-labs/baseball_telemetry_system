name: Publish CI Image

on:
  push:
    paths:
      - Dockerfile
      - .github/workflows/publish-ci-image.yml
  
permissions:
  contents: read
  packages: write

jobs:
  publish-image:
    runs-on: ubuntu-24.04
    
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: docker build -t ghcr.io/codesavvy-labs/baseball-telem-ci:latest .

      - name: Push image
        run: docker push ghcr.io/codesavvy-labs/baseball-telem-ci:latest

